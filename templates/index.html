<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>The Text to Speech App</title>
    <link rel="shortcut icon" href="/wavs/favicon.ico">
    <style>
        .hide {
            display: none;
        }

        .show {
            display: block;
        }

        .label {
            margin-bottom: 10px;
        }

        input[type=radio] {
            width: 3em;
            height: 3em;
        }
        input[type=text], input[type=number], select {
        width: 100%;
        margin: 8px 0;
        padding: 5px 5px;
        border: 2px solid green;
        box-sizing: border-box;
    }
    </style>
</head>
<body>
    <div class="w-full">
        <div id="content" class="jumbotron" style="padding-top: 10px">
            <div class="text-center">
                <h3 class="display-7">Audio Evaluation for Text To Speech System</h3>
                <p class="">Lời giới thiệu:</p>
                <p class="">Lời cảm ơn:</p>
                <p class="">Miêu tả phương pháp đánh giá:</p>
            </div>

            <div class="container">
                <form id="submit_form" name="submit_form" method="POST" action="/submit">
                    <div class="row">
                        <h5 class="display-7"><label><b>Thông tin người làm đánh giá:</b></label></h5>
                        <input type="text" name="input_name" id="name" placeholder="nhập họ và tên">
                        <input type="number" name="input_age" id="age" placeholder="nhập tuổi">
                        <select  name="input_region" id="region">
                          <option value="bắc">Miền bắc</option>
                          <option value="trung">Miền trung</option>
                          <option value="nam">Miền nam</option>
                        </select>
                        <select  name="input_sex" id="sex">
                          <option value="nam">Nam</option>
                          <option value="nữ">Nữ</option>
                          <option value="khác">Khác</option>
                        </select>
                    </div>
                    {% if dict_audiotext %}
                    <div class="container">
                    {% for path, text in dict_audiotext.items() %}
                        <h6 class="display-7">Câu số {{ loop.index }}:</h6>
                        <p class="lead">{{ text }}</p>
                        <div class="row">
                            <div class="col">
                                <div class="media">
                                    <audio controls preload="auto">
                                            <source src="https://followdevices.herokuapp.com/{{path}}" type="audio/mp3">
{#                                        <source src="http://127.0.0.1:9999/{{path}}" type="audio/mp3">#}
                                    </audio>
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <div class="col">
                                        <h6 class="display-7">MOS:</h6>
                                    </div>
                                    <div class="col">
                                    <label for="excellent">
                                        <h6 class="display-7">5</h6>

                                        <input type="radio" id="excellent" name="{{loop.index}}_mos" value="5_{{path}}">
                                    </label><br><br>
                                        </div>

                                    <div class="col">
                                    <label for="good">
                                        <h6 class="display-7">4</h6>

                                        <input type="radio" id="good" name="{{loop.index}}_mos" value="4_{{path}}">
                                    </label><br><br>
                                        </div>

                                    <div class="col">
                                    <label for="fair">
                                        <h6 class="display-7">3</h6>

                                        <input type="radio" id="fair" name="{{loop.index}}_mos" value="3_{{path}}">
                                    </label><br><br>
                                        </div>

                                    <div class="col">
                                    <label for="poor">
                                        <h6 class="display-7">2</h6>
                                        <input type="radio" id="poor" name="{{loop.index}}_mos" value="2_{{path}}">
                                    </label><br><br>
                                        </div>

                                    <div class="col">
                                    <label for="bad">
                                        <h6 class="display-7">1</h6>

                                        <input type="radio" id="bad" name="{{loop.index}}_mos" value="1_{{path}}">
                                    </label><br>
                                        </div>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                    </div>
                    {% endif %}
                    <div id="btnc" class="form-group">
                        <input id="btnc" type="submit" class="btn btn-primary mb-2" value="Gửi đánh giá" />
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js"></script>
        <script type="text/javascript">
            $(document).ready(() => {
                $("#btns").prepend('<div id="loading" style="display : none;" ><button class="btn btn-primary" type="button" disabled><span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>Loading...</button></div>')
            });


        </script>
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"></script>
    </div>
</body>
</html>
